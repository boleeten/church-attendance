<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#041c46" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="%APP_SHORT%" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    %SUPABASE_PRECONNECT%
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <style>
      /* 첫 로딩 화면: 앱 코드와 데이터를 받는 동안 흰 화면 대신 보여 준다 */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #f5f7fa; }
      .boot img { border-radius: 50%; }
      .boot-dot { width: 28px; height: 28px; border-radius: 50%; border: 3px solid #d9e1ec; border-top-color: #041c46; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-dot { animation-duration: 2.4s; } }
    </style>
    <title>%APP_NAME%</title>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="불러오는 중"><img src="/logo.png" alt="" width="72" height="72" /><span class="boot-dot"></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
